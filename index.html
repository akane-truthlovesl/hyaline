<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04060b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Hyaline</title>
<style>
  html, body { margin: 0; height: 100%; background: #04060b; overflow: hidden; overscroll-behavior: none; }
  body { position: fixed; inset: 0; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
         -webkit-tap-highlight-color: transparent; touch-action: none;
         font: 500 11px/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #bfe9ee; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .ui { position: absolute; pointer-events: none; }

  /* the stick: a ring and a nub, there only while the thumb is */
  #stick { left: 0; top: 0; width: 0; height: 0; opacity: 0; transition: opacity .22s ease; will-change: transform, opacity; }
  #stick.on { opacity: 1; transition: opacity .06s ease; }
  #stick::before { content: ""; position: absolute; left: -62px; top: -62px; width: 124px; height: 124px; border-radius: 50%;
                   box-sizing: border-box; border: 1px solid rgba(170, 235, 240, .22);
                   background: radial-gradient(closest-side, rgba(120, 220, 230, .05), rgba(120, 220, 230, 0) 72%); }
  #stick > i { position: absolute; left: -21px; top: -21px; width: 42px; height: 42px; border-radius: 50%; will-change: transform;
               background: radial-gradient(closest-side, rgba(190, 245, 250, .26), rgba(150, 230, 240, .10) 62%, rgba(150, 230, 240, 0));
               box-shadow: inset 0 0 0 1px rgba(200, 248, 252, .28); }

  /* the dial: a short track hanging below the second finger; the bead is the setting —
     high and bright is firm, low and diffuse is supple */
  #dial { left: 0; top: 0; width: 0; height: 0; opacity: 0; transition: opacity .2s ease; will-change: transform, opacity; --firm: 1; }
  #dial.on { opacity: 1; transition: opacity .05s ease; }
  #dial::before { content: ""; position: absolute; left: -1px; top: 0; width: 2px; height: 110px; border-radius: 1px;
                  background: linear-gradient(rgba(200, 248, 252, .32), rgba(120, 200, 230, .08)); }
  #dial > i { position: absolute; left: -15px; top: -15px; width: 30px; height: 30px; border-radius: 50%; will-change: transform;
              background: radial-gradient(closest-side, rgba(220, 252, 255, calc(.12 + .3 * var(--firm))), rgba(150, 230, 240, 0) calc(55% + 40% * (1 - var(--firm))));
              box-shadow: inset 0 0 0 calc(1px + 1px * var(--firm)) rgba(210, 250, 255, calc(.12 + .3 * var(--firm))); }

  #hud { left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 14px); display: flex; justify-content: space-between;
         padding: 0 18px; letter-spacing: .24em; text-transform: uppercase; opacity: .42; font-variant-numeric: tabular-nums; }
  #hud span + span { margin-left: 1.6em; }
  #title { left: 0; right: 0; top: 23%; text-align: center; font-weight: 300; font-size: 21px; letter-spacing: .82em; padding-left: .82em;
           opacity: .78; transition: opacity 1.6s ease; animation: rise 2.4s ease both; }
  #title.gone { opacity: 0; }
  @keyframes rise { from { opacity: 0; letter-spacing: 1.2em; } }
  #summary { left: 0; right: 0; top: 42%; text-align: center; font-size: 14px; letter-spacing: .34em; text-transform: uppercase;
             opacity: 0; transition: opacity .5s ease; font-variant-numeric: tabular-nums; }
  #summary.on { opacity: .92; }
  #hint { left: 0; top: 0; width: 0; height: 0; opacity: 0; transition: opacity .4s ease; }
  #hint.on { opacity: .7; }
  #hint::before { content: ""; position: absolute; left: -9px; top: -5px; border-left: 10px solid #9ff3e2;
                  border-top: 5px solid transparent; border-bottom: 5px solid transparent; filter: drop-shadow(0 0 6px #6fe9d2); }
  #dev { left: 12px; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); white-space: pre; font: 10px/1.5 ui-monospace, Menlo, Consolas, monospace;
         opacity: 0; color: #9fd8e0; }
  #dev.on { opacity: .75; }
  #fail { display: none; inset: 0; align-items: center; justify-content: center; padding: 32px; text-align: center; line-height: 1.6; letter-spacing: .04em; }
  body.failed #fail { display: flex; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="title" class="ui">HYALINE</div>
<div id="hud" class="ui"><div><span id="chamber"></span></div><div><span id="mass"></span><span id="clock"></span></div></div>
<div id="summary" class="ui"></div>
<div id="hint" class="ui"></div>
<div id="stick" class="ui"><i></i></div>
<div id="dial" class="ui"><i></i></div>
<div id="dev" class="ui"></div>
<div id="fail" class="ui"></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
